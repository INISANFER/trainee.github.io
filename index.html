<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Registro de Entrenos</title>
<meta name="theme-color" content="#15171A">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entrenos">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<style>
  :root{
    --bg:#15171A;
    --surface:#1E2226;
    --surface-2:#262B31;
    --line:#31363C;
    --text:#ECEAE4;
    --text-dim:#9CA3AB;
    --gold:#F2B807;
    --gold-dim:#B58A0A;
    --red:#D6544A;
    --green:#4CAF6D;
    --radius:16px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    overscroll-behavior-y:none;
    touch-action:manipulation;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100dvh;
  }
  header{
    padding:calc(var(--safe-top) + 14px) 20px 12px;
    flex-shrink:0;
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  header p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--text-dim);
  }
  main{
    flex:1;
    overflow-y:auto;
    padding:0 16px calc(96px + var(--safe-bottom));
    -webkit-overflow-scrolling:touch;
  }
  main[hidden]{display:none;}

  /* ---------- listas genéricas ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .search{
    width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    font-size:16px;
    padding:12px 14px;
    border-radius:12px;
    margin:14px 0 12px;
  }
  .search::placeholder{color:var(--text-dim);}

  .ex-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:10px;
    color:var(--text);
    font-size:17px;
    font-weight:600;
    text-align:left;
  }
  .ex-item .hint{
    display:block;
    font-size:13px;
    font-weight:400;
    color:var(--text-dim);
    margin-top:3px;
  }
  .ex-item .chev{color:var(--text-dim);font-size:20px;}
  .empty{
    color:var(--text-dim);
    font-size:15px;
    text-align:center;
    padding:40px 20px;
    line-height:1.5;
  }

  /* ---------- botones ---------- */
  button{font-family:inherit;}
  .btn{
    border:none;
    border-radius:14px;
    padding:14px 18px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-gold{background:var(--gold);color:#1A1503;}
  .btn-ghost{background:var(--surface-2);color:var(--text);}
  .btn-outline{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
  .btn-full{width:100%;}
  .btn:active{transform:scale(0.97);}
  .icon-btn{
    background:none;border:none;color:var(--text-dim);
    font-size:20px;line-height:1;padding:6px 8px;cursor:pointer;
  }
  .icon-btn.danger{color:var(--red);}

  /* ---------- tab bar ---------- */
  nav#tabbar{
    position:fixed;
    left:0;right:0;bottom:0;
    display:flex;
    background:rgba(30,34,38,0.92);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:8px 6px calc(8px + var(--safe-bottom));
  }
  nav#tabbar button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:12px;
    font-weight:600;
    padding:6px 4px 2px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
  }
  nav#tabbar button .dot{
    width:6px;height:6px;border-radius:50%;background:transparent;
  }
  nav#tabbar button.active{color:var(--gold);}
  nav#tabbar button.active .dot{background:var(--gold);}

  /* ---------- vista: registrar serie ---------- */
  .log-header{
    display:flex;align-items:center;gap:10px;
    margin:14px 0 18px;
  }
  .log-header h2{
    margin:0;font-size:20px;font-weight:800;flex:1;
    letter-spacing:-0.01em;
  }
  .stepper-block{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 18px;
    margin-bottom:14px;
  }
  .stepper-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.02em;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .stepper{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
  }
  .stepper button{
    width:56px;height:56px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text);
    font-size:26px;
    font-weight:400;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .stepper button:active{background:var(--gold);color:#1A1503;border-color:var(--gold);}
  .stepper .value{
    min-width:118px;
    text-align:center;
    font-size:40px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    letter-spacing:-0.02em;
    background:none;border:none;color:var(--text);
  }
  .stepper .unit{font-size:16px;font-weight:600;color:var(--text-dim);margin-left:4px;}
  .step-hint{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-top:10px;
  }

  /* peso: 4 botones (−5 −1 valor +1 +5), más compactos para caber en iPhone */
  .stepper.weight{gap:6px;}
  .stepper.weight button{
    width:46px;height:46px;
    font-size:15px;
    font-weight:700;
    flex-shrink:0;
  }
  .stepper.weight button.big{
    background:transparent;
    color:var(--gold);
    border-color:var(--gold-dim);
  }
  .stepper.weight button.big:active{background:var(--gold);color:#1A1503;border-color:var(--gold);}
  .stepper.weight .value{
    flex:1;
    min-width:0;
    font-size:34px;
    white-space:nowrap;
  }
  .stepper.weight .unit{font-size:14px;margin-left:3px;}

  /* último entreno */
  .last-session{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin:0 0 14px;
  }
  .last-session .stepper-label{margin-bottom:8px;}
  .last-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .last-chip{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:100px;
    padding:5px 11px;
    font-size:14px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .last-chip .n{color:var(--text-dim);font-weight:700;margin-right:6px;font-size:12px;}
  .last-none{font-size:13px;color:var(--text-dim);}

  .log-btn{
    display:block;
    width:100%;
    background:var(--gold);
    color:#1A1503;
    border:none;
    border-radius:18px;
    padding:20px;
    font-size:18px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:6px 0 22px;
    cursor:pointer;
  }
  .log-btn:active{transform:scale(0.98);background:var(--gold-dim);}

  .sets-title{
    font-size:13px;font-weight:700;color:var(--text-dim);
    margin:0 2px 10px;text-transform:none;
  }
  .set-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .set-row .set-idx{
    color:var(--text-dim);
    font-size:13px;
    font-weight:700;
    width:26px;
  }
  .set-row .set-val{
    flex:1;
    font-size:16px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- ejercicios ---------- */
  .add-row{
    display:flex;gap:8px;margin:14px 0 16px;
  }
  .add-row input{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    font-size:16px;
    padding:12px 14px;
    border-radius:12px;
  }
  .section-label{
    font-size:12px;font-weight:700;color:var(--text-dim);
    letter-spacing:0.02em;
    margin:18px 2px 8px;
  }
  .archived-row{opacity:0.7;}

  /* ---------- segmentado (Ejercicios / Grupos) ---------- */
  .seg-control{
    display:flex;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:3px;
    margin:14px 0 16px;
  }
  .seg-control button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:14px;
    font-weight:700;
    padding:9px 0;
    border-radius:9px;
    cursor:pointer;
  }
  .seg-control button.active{background:var(--surface-2);color:var(--text);}

  /* ---------- chips de grupo (vista Entrenar) ---------- */
  .chip-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 0 2px;
    margin-bottom:2px;
    -webkit-overflow-scrolling:touch;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-size:14px;
    font-weight:700;
    padding:9px 16px;
    border-radius:100px;
    white-space:nowrap;
    cursor:pointer;
  }
  .chip.active{background:var(--gold);color:#1A1503;border-color:var(--gold);}

  /* ---------- grupos: lista y editor ---------- */
  .badge-row{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;}
  .badge{
    font-size:11px;
    font-weight:700;
    color:var(--text-dim);
    background:var(--surface-2);
    border:1px solid var(--line);
    padding:2px 8px;
    border-radius:100px;
  }
  .grp-row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    margin-bottom:8px;
  }
  .grp-row .grp-name{flex:1;font-size:15px;font-weight:600;}
  .grp-row .grp-name .archived-tag{display:block;font-size:12px;font-weight:400;color:var(--text-dim);margin-top:2px;}
  .grp-row .arrows{display:flex;flex-direction:column;gap:2px;}
  .grp-row .arrows button{
    background:none;border:none;color:var(--text-dim);
    font-size:13px;padding:2px 6px;cursor:pointer;line-height:1;
  }
  .grp-row .arrows button:disabled{opacity:0.25;}
  .add-ex-item{
    display:flex;align-items:center;justify-content:space-between;
    width:100%;
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
    color:var(--text);
    font-size:15px;
    text-align:left;
  }

  /* ---------- datos ---------- */
  .stat-grid{display:flex;gap:10px;margin:14px 0 4px;}
  .stat{
    flex:1;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:14px;text-align:center;
  }
  .stat .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .stat.tappable{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .stat.tappable:active{background:var(--surface-2);}

  /* historial */
  .hist-ex{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:0 14px;
    margin-bottom:10px;
  }
  .hist-ex summary{
    list-style:none;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 0;
    cursor:pointer;
    font-size:16px;font-weight:600;
  }
  .hist-ex summary::-webkit-details-marker{display:none;}
  .hist-ex summary .cnt{font-size:12px;color:var(--text-dim);font-weight:600;white-space:nowrap;margin-left:auto;}
  .hist-ex summary::after{
    content:"›";
    color:var(--text-dim);
    font-size:20px;
    line-height:1;
    transition:transform .15s;
  }
  .hist-ex[open] summary::after{transform:rotate(90deg);}
  .hist-day{padding:10px 0 12px;border-top:1px solid var(--line);}
  .hist-dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
  .hist-dayhead .hist-date{margin-bottom:0;}
  .hist-assign{font-size:13px;font-weight:700;color:var(--gold);padding:4px 0 4px 8px;}
  .hist-note{font-size:13px;color:var(--text-dim);line-height:1.45;margin:0 2px 10px;}
  .hist-date{
    font-size:12px;font-weight:700;color:var(--text-dim);
    margin-bottom:7px;text-transform:capitalize;
  }
  .persist-ok{color:var(--green);}
  .persist-warn{color:var(--gold);}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;
    left:50%;
    bottom:calc(94px + var(--safe-bottom));
    transform:translateX(-50%) translateY(12px);
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 18px;
    border-radius:100px;
    font-size:14px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:50;
    white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- modal simple ---------- */
  #modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:80;
  }
  #modal-backdrop[hidden]{display:none;}
  #modal{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px 20px 0 0;
    width:100%;
    max-width:480px;
    padding:20px 20px calc(20px + var(--safe-bottom));
  }
  #modal h3{margin:0 0 6px;font-size:17px;}
  #modal p{margin:0 0 16px;color:var(--text-dim);font-size:14px;line-height:1.5;}
  #modal .modal-actions{display:flex;gap:10px;}
  #modal .modal-actions .btn{flex:1;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="header-title">Registro de Entrenos</h1>
    <p id="header-sub">&nbsp;</p>
  </header>

  <main id="view-entrenar">
    <div id="entrenar-pick">
      <div id="group-chip-row" class="chip-row" hidden></div>
      <input class="search" id="ex-search" placeholder="Buscar ejercicio…" autocomplete="off">
      <div id="ex-pick-list"></div>
    </div>
    <div id="entrenar-log" hidden></div>
  </main>

  <main id="view-ejercicios" hidden>
    <div class="seg-control">
      <button data-seg="ejercicios" class="active">Ejercicios</button>
      <button data-seg="grupos">Grupos</button>
    </div>

    <div id="sub-ejercicios">
      <div class="add-row">
        <input id="new-ex-name" placeholder="Nuevo ejercicio…" autocomplete="off">
        <button class="btn btn-gold" id="add-ex-btn">Añadir</button>
      </div>
      <div id="active-ex-list"></div>
      <div id="archived-wrap"></div>
    </div>

    <div id="sub-grupos" hidden>
      <div id="grupos-list-view">
        <div class="add-row">
          <input id="new-grp-name" placeholder="Nuevo grupo… (p. ej. Empuje)" autocomplete="off">
          <button class="btn btn-gold" id="add-grp-btn">Añadir</button>
        </div>
        <div id="groups-list"></div>
      </div>
      <div id="grupo-editor-view" hidden></div>
    </div>
  </main>

  <main id="view-datos" hidden>
    <div id="datos-main">
    <div class="stat-grid">
      <div class="stat tappable" id="stat-sets-card" role="button" tabindex="0"><div class="n" id="stat-sets">0</div><div class="l">series registradas ›</div></div>
      <div class="stat"><div class="n" id="stat-ex">0</div><div class="l">ejercicios</div></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="row">
        <div>
          <strong style="font-size:15px;">Almacenamiento persistente</strong>
          <div id="persist-status" style="font-size:13px;color:var(--text-dim);margin-top:3px;">Comprobando…</div>
        </div>
      </div>
      <button class="btn btn-outline btn-full" id="persist-btn" style="margin-top:12px;display:none;">Solicitar almacenamiento persistente</button>
    </div>

    <div class="card">
      <strong style="font-size:15px;">Copia de seguridad</strong>
      <p style="font-size:13px;color:var(--text-dim);margin:6px 0 14px;line-height:1.5;">
        Todo se guarda solo en este iPhone. Exporta un archivo de vez en cuando para no perder tu historial.
      </p>
      <button class="btn btn-gold btn-full" id="export-btn">Exportar copia de seguridad</button>
      <button class="btn btn-ghost btn-full" id="import-btn" style="margin-top:8px;">Importar copia de seguridad</button>
      <input type="file" id="import-file" accept="application/json" hidden>
    </div>
    </div>

    <div id="historial-view" hidden></div>
  </main>

  <nav id="tabbar">
    <button data-view="entrenar" class="active"><span class="dot"></span>Entrenar</button>
    <button data-view="ejercicios"><span class="dot"></span>Ejercicios</button>
    <button data-view="datos"><span class="dot"></span>Datos</button>
  </nav>
</div>

<div id="toast"></div>

<div id="modal-backdrop" hidden>
  <div id="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ============================================================
   IndexedDB
============================================================ */
const DB_NAME = "entrenos-db";
const DB_VERSION = 2;
let dbPromise = null;

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("exercises")) {
        db.createObjectStore("exercises", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("sets")) {
        const store = db.createObjectStore("sets", { keyPath: "id" });
        store.createIndex("by_date", "date", { unique: false });
        store.createIndex("by_exercise", "exerciseId", { unique: false });
      }
      if (!db.objectStoreNames.contains("groups")) {
        // grupo: { id, name, exerciseIds: [ids en orden], createdAt }
        db.createObjectStore("groups", { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function tx(storeNames, mode){
  return openDB().then(db => db.transaction(storeNames, mode));
}

function reqToPromise(req){
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function uuid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 10);
}

/* ---- exercises ---- */
async function addExercise(name){
  const t = await tx("exercises", "readwrite");
  const ex = { id: uuid(), name: name.trim(), active: true, createdAt: Date.now() };
  t.objectStore("exercises").add(ex);
  await reqToPromise(t.objectStore("exercises").get(ex.id));
  return ex;
}
async function listExercises(){
  const t = await tx("exercises", "readonly");
  return reqToPromise(t.objectStore("exercises").getAll());
}
async function saveExercise(ex){
  const t = await tx("exercises", "readwrite");
  t.objectStore("exercises").put(ex);
  return new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function deleteExerciseHard(id){
  const t = await tx("exercises", "readwrite");
  t.objectStore("exercises").delete(id);
  return new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
}

/* ---- sets ---- */
async function addSet({ exerciseId, groupId, weight, reps, note }){
  const t = await tx("sets", "readwrite");
  const s = { id: uuid(), exerciseId, groupId: groupId || null, date: todayStr(), weight, reps, note: note || "", ts: Date.now() };
  t.objectStore("sets").add(s);
  return new Promise((res, rej) => { t.oncomplete = () => res(s); t.onerror = () => rej(t.error); });
}
async function deleteSet(id){
  const t = await tx("sets", "readwrite");
  t.objectStore("sets").delete(id);
  return new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function updateSet(s){
  const t = await tx("sets", "readwrite");
  t.objectStore("sets").put(s);
  return new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function allSets(){
  const t = await tx("sets", "readonly");
  return reqToPromise(t.objectStore("sets").getAll());
}
async function allSetsForExercise(exerciseId){
  const t = await tx("sets", "readonly");
  const idx = t.objectStore("sets").index("by_exercise");
  return reqToPromise(idx.getAll(exerciseId));
}

// Grupo efectivo de una serie: el guardado en ella o, en las series antiguas
// (sin grupo guardado), el único grupo al que pertenece el ejercicio. Si el
// ejercicio está en varios grupos y la serie no tiene grupo, queda sin asignar (null).
function effGroup(s, memberIds){
  if (s.groupId) return s.groupId;
  return memberIds.length === 1 ? memberIds[0] : null;
}

// ctx = { gid, members }: grupo con el que se trabaja y grupos a los que pertenece el ejercicio.
// Sin ctx se devuelven todas las series del ejercicio.
async function setsFor(exerciseId, ctx){
  const all = await allSetsForExercise(exerciseId);
  if (!ctx) return all;
  const ids = ctx.members.map(g => g.id);
  return all.filter(s => effGroup(s, ids) === ctx.gid);
}

// Decide con qué grupo se trabaja un ejercicio al abrirlo
async function resolveCtx(ex){
  const members = await groupsForExercise(ex.id);
  let gid = null;
  if (members.length === 1) {
    gid = members[0].id;
  } else if (members.length > 1) {
    if (state.selectedGroupId && members.some(g => g.id === state.selectedGroupId)) {
      gid = state.selectedGroupId;
    } else {
      // vista "Todos": el último grupo con el que se registró este ejercicio
      const all = await allSetsForExercise(ex.id);
      const lastWith = all
        .filter(s => s.groupId && members.some(g => g.id === s.groupId))
        .sort((a, b) => b.ts - a.ts)[0];
      gid = lastWith ? lastWith.groupId : members[0].id;
    }
  }
  return { gid, members };
}

async function setsForExerciseToday(exerciseId, ctx){
  const all = await setsFor(exerciseId, ctx);
  const today = todayStr();
  return all.filter(s => s.date === today).sort((a, b) => a.ts - b.ts);
}
async function lastSetFor(exerciseId, ctx){
  const all = await setsFor(exerciseId, ctx);
  if (!all.length) return null;
  return all.sort((a, b) => b.ts - a.ts)[0];
}
// Series del entreno más reciente ANTERIOR a hoy (las de hoy ya se muestran aparte)
async function lastSessionSets(exerciseId, ctx){
  const all = await setsFor(exerciseId, ctx);
  const today = todayStr();
  const past = all.filter(s => s.date < today);
  if (!past.length) return [];
  const lastDate = past.reduce((m, s) => (s.date > m ? s.date : m), past[0].date);
  return past.filter(s => s.date === lastDate).sort((a, b) => a.ts - b.ts);
}
async function lastUsedTs(exerciseId){
  const s = await lastSetFor(exerciseId);
  return s ? s.ts : 0;
}

}
async function addGroup(name){
  const t = await tx("groups", "readwrite");
  const g = { id: uuid(), name: name.trim(), exerciseIds: [], createdAt: Date.now() };
  t.objectStore("groups").add(g);
  return new Promise((res, rej) => { t.oncomplete = () => res(g); t.onerror = () => rej(t.error); });
}
async function saveGroup(g){
  const t = await tx("groups", "readwrite");
  t.objectStore("groups").put(g);
  return new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function deleteGroup(id){
  const t = await tx("groups", "readwrite");
  t.objectStore("groups").delete(id);
  return new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function cleanupGroupReferences(exerciseId){
  const groups = await listGroups();
  for (const g of groups) {
    if (g.exerciseIds.includes(exerciseId)) {
      g.exerciseIds = g.exerciseIds.filter(id => id !== exerciseId);
      await saveGroup(g);
    }
  }
}
async function groupsForExercise(exerciseId){
  const groups = await listGroups();
  return groups.filter(g => g.exerciseIds.includes(exerciseId));
}

async function renderGroupChips(){
  const chipWrap = $("#group-chip-row");
  const groups = await listGroups();
  if (!groups.length) {
    chipWrap.hidden = true;
    chipWrap.innerHTML = "";
    return;
  }
  chipWrap.hidden = false;
  chipWrap.innerHTML = "";

  const allChip = document.createElement("button");
  allChip.className = "chip" + (state.selectedGroupId === null ? " active" : "");
  allChip.textContent = "Todos";
  allChip.addEventListener("click", () => { state.selectedGroupId = null; renderPickList($("#ex-search").value); });
  chipWrap.appendChild(allChip);

  for (const g of groups) {
    const chip = document.createElement("button");
    chip.className = "chip" + (state.selectedGroupId === g.id ? " active" : "");
    chip.textContent = g.name;
    chip.addEventListener("click", () => { state.selectedGroupId = g.id; renderPickList($("#ex-search").value); });
    chipWrap.appendChild(chip);
  }
}

async function renderPickList(filter = ""){
  $("#entrenar-pick").hidden = false;
  $("#entrenar-log").hidden = true;
  state.currentExercise = null;

  await renderGroupChips();

  const all = await listExercises();
  const active = all.filter(e => e.active);

  let ordered;
  const groups = state.selectedGroupId ? await listGroups() : null;
  const selectedGroup = groups ? groups.find(g => g.id === state.selectedGroupId) : null;

  if (state.selectedGroupId && !selectedGroup) state.selectedGroupId = null;

  if (selectedGroup) {
    const byId = new Map(active.map(e => [e.id, e]));
    ordered = selectedGroup.exerciseIds.map(id => byId.get(id)).filter(Boolean);
  } else {
    const withTs = await Promise.all(active.map(async e => ({ e, ts: await lastUsedTs(e.id) })));
    withTs.sort((a, b) => b.ts - a.ts || a.e.name.localeCompare(b.e.name, "es"));
    ordered = withTs.map(({ e }) => e);
  }

  const q = filter.trim().toLowerCase();
  const list = ordered.filter(e => e.name.toLowerCase().includes(q));

  const wrap = $("#ex-pick-list");
  wrap.innerHTML = "";

  if (!all.length) {
    wrap.innerHTML = `<div class="empty">Todavía no tienes ejercicios.<br>Ve a la pestaña <strong>Ejercicios</strong> y añade el primero.</div>`;
    return;
  }
  if (!list.length) {
    wrap.innerHTML = state.selectedGroupId
      ? `<div class="empty">Este grupo no tiene ejercicios activos todavía.<br>Edítalo desde <strong>Ejercicios › Grupos</strong>.</div>`
      : `<div class="empty">Sin resultados para "${escapeHtml(filter)}".</div>`;
    return;
  }

  for (const ex of list) {
    const last = await lastSetFor(ex.id, await resolveCtx(ex));
    const btn = document.createElement("button");
    btn.className = "ex-item";
    btn.innerHTML = `
      <span>${escapeHtml(ex.name)}${last ? `<span class="hint">último: ${fmtWeight(last.weight)} × ${last.reps}</span>` : `<span class="hint">sin registros aún</span>`}</span>
      <span class="chev">›</span>`;
    btn.addEventListener("click", () => openLogView(ex));
    wrap.appendChild(btn);
  }
}

$("#ex-search").addEventListener("input", (e) => renderPickList(e.target.value));

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function fmtWeight(w){
  return (Math.round(w * 100) / 100).toString().replace(".", ",") + " kg";
}

async function openLogView(ex){
  state.currentExercise = ex;
  state.logCtx = await resolveCtx(ex);
  const last = await lastSetFor(ex.id, state.logCtx);
  state.weight = last ? last.weight : 20;
  state.reps = last ? last.reps : 8;

  $("#entrenar-pick").hidden = true;
  $("#entrenar-log").hidden = false;
  await renderLogView();
}

function backToPick(){
  if (state.currentExercise) renderPickList();
}

async function renderLogView(){
  const ex = state.currentExercise;
  const ctx = state.logCtx;
  const todaySets = await setsForExerciseToday(ex.id, ctx);
  const lastSets = await lastSessionSets(ex.id, ctx);

  // Selector de grupo: solo para ejercicios que están en varios grupos
  const groupPickHtml = ctx.members.length > 1
    ? `<div class="stepper-label">GRUPO</div>
       <div class="chip-row" id="log-group-row" style="padding-top:0;margin-bottom:12px;">
         ${ctx.members.map(g => `<button class="chip${g.id === ctx.gid ? " active" : ""}" data-gid="${escapeHtml(g.id)}">${escapeHtml(g.name)}</button>`).join("")}
       </div>`
    : "";

  const lastHtml = lastSets.length
    ? `<div class="last-chips">${lastSets.map((s, i) =>
        `<span class="last-chip"><span class="n">${i + 1}</span>${fmtWeight(s.weight)} × ${s.reps}</span>`
      ).join("")}</div>`
    : `<div class="last-none">Sin entrenos anteriores.</div>`;

  const wrap = $("#entrenar-log");
  wrap.innerHTML = `
    <div class="log-header">
      <button class="icon-btn" id="back-btn">‹ Ejercicios</button>
    </div>
    <h2 style="margin:-8px 0 16px;">${escapeHtml(ex.name)}</h2>

    ${groupPickHtml}

    <div class="last-session">
      <div class="stepper-label">ÚLTIMO ENTRENO</div>
      ${lastHtml}
    </div>

    <div class="stepper-block">
      <div class="stepper-label">PESO</div>
      <div class="stepper weight">
        <button class="big" id="w-minus5">−5</button>
        <button id="w-minus1">−1</button>
        <div class="value">${fmtNum(state.weight)}<span class="unit">kg</span></div>
        <button id="w-plus1">+1</button>
        <button class="big" id="w-plus5">+5</button>
      </div>
      <div class="step-hint">toca el número para escribirlo a mano</div>
    </div>

    <div class="stepper-block">
      <div class="stepper-label">REPETICIONES</div>
      <div class="stepper">
        <button id="r-minus">−</button>
        <div class="value">${state.reps}</div>
        <button id="r-plus">+</button>
      </div>
    </div>

    <button class="log-btn" id="log-set-btn">Registrar serie</button>

    <div class="sets-title">Series de hoy (${todaySets.length})</div>
    <div id="today-sets-list"></div>
  `;

  $("#back-btn").addEventListener("click", backToPick);
  $("#w-minus5").addEventListener("click", () => changeWeight(-5));
  $("#w-minus1").addEventListener("click", () => changeWeight(-1));
  $("#w-plus1").addEventListener("click", () => changeWeight(+1));
  $("#w-plus5").addEventListener("click", () => changeWeight(+5));
  $("#r-minus").addEventListener("click", () => changeReps(-0.5));
  $("#r-plus").addEventListener("click", () => changeReps(+0.5));
  $(".stepper-block .value").addEventListener("click", promptWeight);
  $("#log-set-btn").addEventListener("click", logCurrentSet);
  wrap.querySelectorAll("#log-group-row .chip").forEach(c => c.addEventListener("click", async () => {
    state.logCtx.gid = c.dataset.gid;
    const last = await lastSetFor(ex.id, state.logCtx);
    state.weight = last ? last.weight : 20;
    state.reps = last ? last.reps : 8;
    await renderLogView();
  }));

  renderTodaySets(todaySets);
}

function fmtNum(n){
  const r = Math.round(n * 100) / 100;
  return r.toString().replace(".", ",");
}

function changeWeight(delta){
  state.weight = Math.max(0, Math.round((state.weight + delta) * 100) / 100);
  updateStepperValues();
}
function changeReps(delta){
  state.reps = Math.max(0, state.reps + delta);
  updateStepperValues();
}
function updateStepperValues(){
  const vals = $$("#entrenar-log .value");
  vals[0].innerHTML = `${fmtNum(state.weight)}<span class="unit">kg</span>`;
  vals[1].textContent = state.reps;
}
function promptWeight(){
  const input = prompt("Peso (kg)", fmtNum(state.weight).replace(",", "."));
  if (input === null) return;
  const n = parseFloat(input.replace(",", "."));
  if (!isNaN(n) && n >= 0) {
    state.weight = Math.round(n * 100) / 100;
    updateStepperValues();
  }
}

async function logCurrentSet(){
  await addSet({ exerciseId: state.currentExercise.id, groupId: state.logCtx.gid, weight: state.weight, reps: state.reps });
  await requestPersistIfNeeded();
  showToast("Serie registrada");
  const todaySets = await setsForExerciseToday(state.currentExercise.id, state.logCtx);
  $(".sets-title").textContent = `Series de hoy (${todaySets.length})`;
  renderTodaySets(todaySets);
}

function renderTodaySets(sets){
  const wrap = $("#today-sets-list");
  wrap.innerHTML = "";
  if (!sets.length) {
    wrap.innerHTML = `<div class="empty" style="padding:20px 10px;">Aún no has registrado ninguna serie hoy.</div>`;
    return;
  }
  sets.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "set-row";
    row.innerHTML = `
      <span class="set-idx">${i + 1}</span>
      <span class="set-val">${fmtWeight(s.weight)} × ${s.reps}</span>
      <button class="icon-btn danger" title="Eliminar">✕</button>
    `;
    row.querySelector("button").addEventListener("click", () => confirmDeleteSet(s));
    wrap.appendChild(row);
  });
}

function confirmDeleteSet(s){
  openModal({
    title: "¿Eliminar esta serie?",
    body: `${fmtWeight(s.weight)} × ${s.reps} repeticiones.`,
    actions: [
      { label: "Cancelar", cls: "btn-ghost" },
      { label: "Eliminar", cls: "btn-outline", onClick: async () => {
        await deleteSet(s.id);
        const todaySets = await setsForExerciseToday(state.currentExercise.id, state.logCtx);
        $(".sets-title").textContent = `Series de hoy (${todaySets.length})`;
        renderTodaySets(todaySets);
        showToast("Serie eliminada");
      }},
    ],
  });
}

async function renderExerciseManager(){
  const all = await listExercises();
  all.sort((a, b) => a.name.localeCompare(b.name, "es"));
  const active = all.filter(e => e.active);
  const archived = all.filter(e => !e.active);

  const activeWrap = $("#active-ex-list");
  activeWrap.innerHTML = "";
  if (!active.length) {
    activeWrap.innerHTML = `<div class="empty">Añade tu primer ejercicio arriba.</div>`;
  }
  for (const ex of active) {
    const setsCount = (await allSetsForExercise(ex.id)).length;
    const exGroups = await groupsForExercise(ex.id);
    const row = document.createElement("div");
    row.className = "card row";
    row.innerHTML = `
      <span style="flex:1;">
        <span style="font-size:16px;font-weight:600;">${escapeHtml(ex.name)}</span>
        ${exGroups.length ? `<span class="badge-row">${exGroups.map(g => `<span class="badge">${escapeHtml(g.name)}</span>`).join("")}</span>` : ""}
      </span>
      <button class="icon-btn" title="Renombrar">✎</button>
      <button class="icon-btn danger" title="Archivar">🗄</button>
    `;
    const [renameBtn, archiveBtn] = row.querySelectorAll("button");
    renameBtn.addEventListener("click", () => renameExercise(ex));
    archiveBtn.addEventListener("click", () => archiveExercise(ex, setsCount));
    activeWrap.appendChild(row);
  }

  const archWrap = $("#archived-wrap");
  archWrap.innerHTML = "";
  if (archived.length) {
    const label = document.createElement("div");
    label.className = "section-label";
    label.textContent = "ARCHIVADOS";
    archWrap.appendChild(label);
    for (const ex of archived) {
      const setsCount = (await allSetsForExercise(ex.id)).length;
      const row = document.createElement("div");
      row.className = "card row archived-row";
      row.innerHTML = `
        <span style="font-size:15px;flex:1;">${escapeHtml(ex.name)}</span>
        <button class="icon-btn" title="Reactivar">↩︎</button>
        ${setsCount === 0 ? '<button class="icon-btn danger" title="Eliminar">✕</button>' : ""}
      `;
      const buttons = row.querySelectorAll("button");
      buttons[0].addEventListener("click", () => reactivateExercise(ex));
      if (buttons[1]) buttons[1].addEventListener("click", () => hardDeleteExercise(ex));
      archWrap.appendChild(row);
    }
  }
}

function renameExercise(ex){
  const name = prompt("Nombre del ejercicio", ex.name);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  ex.name = trimmed;
  saveExercise(ex).then(() => { renderExerciseManager(); showToast("Ejercicio actualizado"); });
}

function archiveExercise(ex, setsCount){
  openModal({
    title: `Archivar "${ex.name}"`,
    body: setsCount
      ? `Tiene ${setsCount} serie(s) registradas: se conservan en el historial, pero dejará de aparecer para registrar nuevas series. Puedes reactivarlo cuando quieras.`

function hardDeleteExercise(ex){
  openModal({
    title: `Eliminar "${ex.name}"`,

    actions: [
      { label: "Cancelar", cls: "btn-ghost" },

    btn.innerHTML = `
      <span>${escapeHtml(g.name)}<span class="hint">${g.exerciseIds.length} ejercicio(s)</span></span>
      <span class="chev">›</span>`;
    btn.addEventListener("click", () => openGroupEditorById(g.id));
    wrap.appendChild(btn);
  }
}

$("#add-grp-btn").addEventListener("click", async () => {
  const input = $("#new-grp-name");
  const name = input.value.trim();
  if (!name) return;
  await addGroup(name);
  input.value = "";
  renderGroupsManager();
  showToast("Grupo creado");
});
$("#new-grp-name").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#add-grp-btn").click(); });

async function openGroupEditorById(id){
  const groups = await listGroups();
  const group = groups.find(g => g.id === id);
  if (!group) {
    state.editingGroupId = null;
    $("#grupo-editor-view").hidden = true;
    $("#grupos-list-view").hidden = false;
    renderGroupsManager();
    return;
  }
  state.editingGroupId = id;
  $("#grupos-list-view").hidden = true;
  $("#grupo-editor-view").hidden = false;
  await renderGroupEditorView(group);
}

async function renderGroupEditorView(group){
  const allExercises = await listExercises();
  const active = allExercises.filter(e => e.active);
  const byId = new Map(allExercises.map(e => [e.id, e]));

  const included = group.exerciseIds.map(id => byId.get(id)).filter(Boolean);
  const availableToAdd = active.filter(e => !group.exerciseIds.includes(e.id));

  const wrap = $("#grupo-editor-view");
  wrap.innerHTML = `
    <div class="log-header">
      <button class="icon-btn" id="grp-back-btn">‹ Grupos</button>
    </div>
    <div class="row" style="margin:-4px 0 16px;">
      <h2 style="margin:0;font-size:20px;font-weight:800;">${escapeHtml(group.name)}</h2>
      <div>
        <button class="icon-btn" id="grp-rename-btn" title="Renombrar">✎</button>
        <button class="icon-btn danger" id="grp-delete-btn" title="Eliminar grupo">✕</button>
      </div>
    </div>

    <div class="section-label">EJERCICIOS DEL GRUPO, EN ORDEN</div>
    <div id="grp-included-list"></div>

    <div class="section-label">AÑADIR EJERCICIOS</div>
    <div id="grp-available-list"></div>
  `;

  $("#grp-back-btn").addEventListener("click", () => {
    state.editingGroupId = null;
    $("#grupo-editor-view").hidden = true;
    $("#grupos-list-view").hidden = false;
    renderGroupsManager();
  });
  $("#grp-rename-btn").addEventListener("click", () => {
    const name = prompt("Nombre del grupo", group.name);
    if (name === null) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    group.name = trimmed;
    saveGroup(group).then(() => renderGroupEditorView(group));
  });
  $("#grp-delete-btn").addEventListener("click", () => {
    openModal({
      title: `Eliminar grupo "${group.name}"`,
      body: `Los ejercicios y su historial no se ven afectados: solo se elimina esta agrupación.`,
      actions: [
        { label: "Cancelar", cls: "btn-ghost" },
        { label: "Eliminar", cls: "btn-outline", onClick: async () => {
          await deleteGroup(group.id);
          if (state.selectedGroupId === group.id) state.selectedGroupId = null;
          state.editingGroupId = null;
          $("#grupo-editor-view").hidden = true;
          $("#grupos-list-view").hidden = false;
          renderGroupsManager();
          showToast("Grupo eliminado");
        }},
      ],
    });
  });

  const incWrap = $("#grp-included-list");
  incWrap.innerHTML = "";
  if (!included.length) {
    incWrap.innerHTML = `<div class="empty" style="padding:16px 10px;">Añade ejercicios desde la lista de abajo.</div>`;
  }
  included.forEach((ex, i) => {
    const row = document.createElement("div");
    row.className = "grp-row";
    row.innerHTML = `
      <div class="arrows">
        <button ${i === 0 ? "disabled" : ""} title="Subir">▲</button>
        <button ${i === included.length - 1 ? "disabled" : ""} title="Bajar">▼</button>
      </div>
      <span class="grp-name">${escapeHtml(ex.name)}${!ex.active ? `<span class="archived-tag">archivado</span>` : ""}</span>
      <button class="icon-btn danger" title="Quitar del grupo">✕</button>
    `;
    const [upBtn, downBtn] = row.querySelectorAll(".arrows button");
    const removeBtn = row.querySelector(".icon-btn.danger");
    upBtn.addEventListener("click", async () => { await moveExerciseInGroup(group, ex.id, -1); renderGroupEditorView(group); });
    downBtn.addEventListener("click", async () => { await moveExerciseInGroup(group, ex.id, 1); renderGroupEditorView(group); });
    removeBtn.addEventListener("click", async () => {
      group.exerciseIds = group.exerciseIds.filter(id => id !== ex.id);
      await saveGroup(group);
      renderGroupEditorView(group);
    });
    incWrap.appendChild(row);
  });

  const availWrap = $("#grp-available-list");
  availWrap.innerHTML = "";
  if (!availableToAdd.length) {
    availWrap.innerHTML = `<div class="empty" style="padding:16px 10px;">${active.length ? "Ya están todos añadidos." : "No tienes ejercicios activos. Créalos en la pestaña Ejercicios."}</div>`;
  }
  availableToAdd.forEach(ex => {
    const btn = document.createElement("button");
    btn.className = "add-ex-item";
    btn.innerHTML = `<span>${escapeHtml(ex.name)}</span><span style="color:var(--gold);font-weight:700;">+ añadir</span>`;
    btn.addEventListener("click", async () => {
      group.exerciseIds.push(ex.id);
      await saveGroup(group);
      renderGroupEditorView(group);
    });
    availWrap.appendChild(btn);
  });
}

async function moveExerciseInGroup(group, exerciseId, direction){
  const idx = group.exerciseIds.indexOf(exerciseId);
  if (idx === -1) return;
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= group.exerciseIds.length) return;
  const arr = group.exerciseIds;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  await saveGroup(group);
}

/* ============================================================
   Vista: Datos (backup + almacenamiento)
============================================================ */
function fmtDate(iso){
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("es-ES", {
    weekday: "short", day: "numeric", month: "short", year: "numeric",
  });
}

async function openHistorial(){
  $("#datos-main").hidden = true;
  $("#historial-view").hidden = false;
  $("#header-title").textContent = "Historial";
  $("#header-sub").textContent = "Todas las series registradas";
  window.scrollTo(0, 0);
  await renderHistorial();
}

async function renderHistorial(){
  const wrap = $("#historial-view");
  const [exercises, sets, groups] = await Promise.all([listExercises(), allSets(), listGroups()]);
  const exById = new Map(exercises.map(e => [e.id, e]));
  const groupsById = new Map(groups.map(g => [g.id, g]));
  const membersByEx = new Map(); // exerciseId -> [grupos a los que pertenece]
  for (const g of groups) for (const id of g.exerciseIds) {
    if (!membersByEx.has(id)) membersByEx.set(id, []);
    membersByEx.get(id).push(g);
  }

  // Reparto de series: por grupo → ejercicio.
  // "unassigned": series antiguas de ejercicios que están en varios grupos.
  // "none": ejercicios sin grupo (o series de un grupo que ya no existe).
  const buckets = new Map();
  for (const s of sets) {
    if (!exById.has(s.exerciseId)) continue;
    const members = membersByEx.get(s.exerciseId) || [];
    let key;
    if (s.groupId) key = groupsById.has(s.groupId) ? s.groupId : "none";
    else if (members.length === 1) key = members[0].id;
    else if (members.length === 0) key = "none";
    else key = "unassigned";
    if (!buckets.has(key)) buckets.set(key, new Map());
    const byEx = buckets.get(key);
    if (!byEx.has(s.exerciseId)) byEx.set(s.exerciseId, []);
    byEx.get(s.exerciseId).push(s);
  }

  // Inferencia por día: una serie sin asignar de un ejercicio en varios grupos se asigna al
  // grupo que ese día ya consta por los demás ejercicios, si es uno solo de sus grupos.
  const dayGroups = new Map(); // fecha -> grupos con series ese día
  for (const [key, byEx] of buckets) {
    if (key === "unassigned" || key === "none") continue;
    for (const list of byEx.values()) for (const s of list) {
      if (!dayGroups.has(s.date)) dayGroups.set(s.date, new Set());
      dayGroups.get(s.date).add(key);
    }
  }
  const inferred = []; // { sets, gid }
  if (buckets.has("unassigned")) {
    for (const [exId, list] of buckets.get("unassigned")) {
      const byDate = new Map();
      for (const s of list) {
        if (!byDate.has(s.date)) byDate.set(s.date, []);
        byDate.get(s.date).push(s);
      }
      for (const [date, daySets] of byDate) {
        const cands = (membersByEx.get(exId) || []).filter(g => (dayGroups.get(date) || new Set()).has(g.id));
        if (cands.length === 1) inferred.push({ sets: daySets, gid: cands[0].id });
      }
    }
  }
  const inferredCount = inferred.reduce((n, x) => n + x.sets.length, 0);

  const exCard = (ex, list, assignable) => {
    list = list.slice().sort((a, b) => a.ts - b.ts);
    const byDate = new Map();
    for (const s of list) {
      if (!byDate.has(s.date)) byDate.set(s.date, []);
      byDate.get(s.date).push(s);
    }
    let dates = [...byDate.keys()].sort();
    if (state.histDesc) dates.reverse();
    const days = dates.map(d => `
      <div class="hist-day">
        <div class="hist-dayhead">
          <div class="hist-date">${escapeHtml(fmtDate(d))}</div>
          ${assignable ? `<button class="icon-btn hist-assign" data-ex="${escapeHtml(ex.id)}" data-date="${d}">Asignar a grupo…</button>` : ""}
        </div>
        <div class="last-chips">${byDate.get(d).map((s, i) =>
          `<span class="last-chip"><span class="n">${i + 1}</span>${fmtWeight(s.weight)} × ${s.reps}</span>`
        ).join("")}</div>
      </div>`).join("");
    const name = escapeHtml(ex.name) + (ex.active ? "" : " (archivado)");
    return `<details class="hist-ex">
      <summary><span>${name}</span><span class="cnt">${list.length} serie${list.length === 1 ? "" : "s"}</span></summary>
      ${days}
    </details>`;
  };

  const section = (label, byEx, assignable) => {
    const exs = [...byEx.keys()].map(id => exById.get(id)).sort((a, b) => a.name.localeCompare(b.name, "es"));
    return `<div class="section-label">${escapeHtml(label.toUpperCase())}</div>`
      + (assignable ? `<div class="hist-note">Series anteriores a la separación por grupos, de ejercicios que están en varios. Asígnalas a un grupo para que no se mezclen.</div>`
          + (inferred.length ? `<button class="btn btn-gold btn-full" id="hist-auto" style="margin-bottom:12px;">Asignar automáticamente por el día (${inferredCount} series)</button>` : "")
        : "")
      + exs.map(ex => exCard(ex, byEx.get(ex.id), assignable)).join("");
  };

  let body = "";
  for (const g of groups) if (buckets.has(g.id)) body += section(g.name, buckets.get(g.id), false);
  if (buckets.has("unassigned")) body += section("Sin asignar a un grupo", buckets.get("unassigned"), true);
  if (buckets.has("none")) body += section("Sin grupo", buckets.get("none"), false);
  if (!body) body = `<div class="empty">Aún no hay series registradas.</div>`;

  wrap.innerHTML = `
    <div class="log-header">
      <button class="icon-btn" id="hist-back-btn">‹ Datos</button>
    </div>
    <div class="seg-control">
      <button data-desc="0" class="${state.histDesc ? "" : "active"}">Antiguas primero</button>
      <button data-desc="1" class="${state.histDesc ? "active" : ""}">Recientes primero</button>
    </div>
    ${body}
  `;
  $("#hist-back-btn").addEventListener("click", () => setView("datos"));
  wrap.querySelectorAll(".seg-control button").forEach(b => b.addEventListener("click", () => {
    state.histDesc = b.dataset.desc === "1";
    renderHistorial();
  }));

  // Asignación automática según los demás ejercicios hechos ese mismo día
  const autoBtn = $("#hist-auto");
  if (autoBtn) autoBtn.addEventListener("click", () => {
    const total = buckets.get("unassigned").size
      ? [...buckets.get("unassigned").values()].reduce((n, l) => n + l.length, 0) : 0;
    openModal({
      title: "Asignar automáticamente",
      body: `Se asignarán ${inferredCount} de ${total} series sin asignar al grupo que se entrenó ese mismo día, según los demás ejercicios registrados. Las que no se puedan deducir quedarán sin asignar para que las elijas tú.`,
      actions: [
        { label: "Cancelar", cls: "btn-ghost" },
        { label: "Asignar", cls: "btn-gold", onClick: async () => {
          for (const { sets, gid } of inferred) for (const s of sets) await updateSet({ ...s, groupId: gid });
          showToast(`${inferredCount} series asignadas`);
          renderHistorial();
        }},
      ],
    });
  });

  // Asignar a un grupo las series de un ejercicio en un día concreto
  wrap.querySelectorAll(".hist-assign").forEach(btn => btn.addEventListener("click", () => {
    const exId = btn.dataset.ex, date = btn.dataset.date;
    const ex = exById.get(exId);
    const members = membersByEx.get(exId) || [];
    openModal({
      title: "Asignar series a un grupo",
      body: `${ex.name} · ${fmtDate(date)}`,
      actions: [
        ...members.map(g => ({ label: g.name, cls: "btn-gold", onClick: async () => {
          const toMove = (buckets.get("unassigned").get(exId) || []).filter(s => s.date === date);
          for (const s of toMove) await updateSet({ ...s, groupId: g.id });
          showToast("Series asignadas a " + g.name);
          renderHistorial();
        }})),
        { label: "Cancelar", cls: "btn-ghost" },
      ],
    });
  }));
}

$("#stat-sets-card").addEventListener("click", openHistorial);
$("#stat-sets-card").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openHistorial(); }
});

async function renderDatos(){
  const [exercises, sets] = await Promise.all([listExercises(), allSets()]);
  $("#stat-sets").textContent = sets.length;
  $("#stat-ex").textContent = exercises.filter(e => e.active).length;

  const statusEl = $("#persist-status");
  const btn = $("#persist-btn");
  if (navigator.storage && navigator.storage.persisted) {
    const persisted = await navigator.storage.persisted();
    if (persisted) {
      statusEl.textContent = "Activado: iOS no debería borrar tus datos por inactividad.";
      statusEl.className = "persist-ok";
      btn.style.display = "none";
    } else {
      statusEl.textContent = "No concedido todavía. Actívalo para proteger tu historial.";
      statusEl.className = "persist-warn";
      btn.style.display = "block";
    }
  } else {
    statusEl.textContent = "Este navegador no informa del estado.";
    btn.style.display = "none";
  }
}

$("#persist-btn").addEventListener("click", async () => {
  if (navigator.storage && navigator.storage.persist) {
    const ok = await navigator.storage.persist();
    showToast(ok ? "Almacenamiento persistente activado" : "No concedido por el sistema");
    renderDatos();
  }
});

async function requestPersistIfNeeded(){
  try {
    if (navigator.storage && navigator.storage.persisted && navigator.storage.persist) {
      const already = await navigator.storage.persisted();
      if (!already) await navigator.storage.persist();
    }
  } catch (_) { /* silencioso: no es crítico */ }
}

$("#export-btn").addEventListener("click", async () => {
  const [exercises, sets, groups] = await Promise.all([listExercises(), allSets(), listGroups()]);
  const payload = { app: "entrenos", version: 2, exportedAt: new Date().toISOString(), exercises, sets, groups };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = todayStr();
  a.href = url;
  a.download = `entrenos-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast("Copia de seguridad descargada");
});

$("#import-btn").addEventListener("click", () => $("#import-file").click());
$("#import-file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.exercises) || !Array.isArray(data.sets)) {
      throw new Error("formato inválido");
    }
    const groups = Array.isArray(data.groups) ? data.groups : [];
    openModal({
      title: "Importar copia de seguridad",
      body: `Se combinará con tus datos actuales: ${data.exercises.length} ejercicio(s), ${groups.length} grupo(s) y ${data.sets.length} serie(s). Los registros con el mismo id se sobrescriben; el resto se añade.`,
      actions: [
        { label: "Cancelar", cls: "btn-ghost" },
        { label: "Importar", cls: "btn-gold", onClick: async () => {
          for (const ex of data.exercises) await saveExercise(ex);
          for (const g of groups) await saveGroup(g);
          for (const s of data.sets) await updateSet(s);
          renderDatos();
          showToast("Importación completada");
        }},
      ],
    });
  } catch (err) {
    openModal({
      title: "No se pudo importar",
      body: "El archivo no tiene el formato esperado de una copia de seguridad de esta app.",
      actions: [{ label: "Entendido", cls: "btn-ghost" }],
    });
  }
});
